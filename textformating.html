<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text formating example </title>
</head>
<body>
    <h2>text formating example </h2>
    <b>bold text  </b>
    <br>
        <strong> Important </strong>
        <br>
        <i>Italic </i> 
        <br>
        <em> Emphasized </em> 
        <br>
     <u>underline </u> 
     <br>
     <small> small text </small>
     <br>
     <p> H <sub> 2 </sub> O</p>
     <p>X <sup> 2</sup>
     </p>

    
</body>
</html>
